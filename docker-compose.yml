version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: supportswarm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: supportswarm
      POSTGRES_PASSWORD: supportswarm_password
      POSTGRES_DB: supportswarm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportswarm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: supportswarm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supportswarm-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://supportswarm:supportswarm_password@postgres:5432/supportswarm
      SYNC_DATABASE_URL: postgresql://supportswarm:supportswarm_password@postgres:5432/supportswarm
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: supportswarm-prod-secret-key-change-me
      AI_MODEL_PROVIDER: mock_hermes
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supportswarm-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_storage:
